services:
  fixture:
    build:
      context: ../..
      dockerfile: test/docker/Dockerfile.fixture
    image: dproxy-e2e-fixture:local
    user: "${DPROXY_E2E_UID:-65532}:${DPROXY_E2E_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${DPROXY_E2E_DIR}
        target: /run/e2e
        read_only: true
    networks:
      e2e:
        ipv4_address: 9.9.9.2

  dproxy:
    build:
      context: ../..
    image: dproxy:local
    user: "${DPROXY_E2E_UID:-65532}:${DPROXY_E2E_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - server
      - --config
      - /run/e2e/server.toml
    volumes:
      - type: bind
        source: ${DPROXY_E2E_DIR}
        target: /run/e2e
        read_only: true
      - type: bind
        source: ${DPROXY_E2E_DIR}/ca.pem
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
    ports:
      - "127.0.0.1:18686:8686"
    depends_on:
      - fixture
    networks:
      e2e:
        ipv4_address: 9.9.9.3

  # The services below run only for TestDockerizedClientSidecar. front stands
  # in for the public WSS front end at the address the fixture resolver gives
  # relay.e2e.test.
  front:
    image: dproxy-e2e-fixture:local
    profiles:
      - sidecar
    user: "${DPROXY_E2E_UID:-65532}:${DPROXY_E2E_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - front
      - /run/e2e
    volumes:
      - type: bind
        source: ${DPROXY_E2E_DIR}
        target: /run/e2e
        read_only: true
    depends_on:
      - dproxy
    networks:
      e2e:
        ipv4_address: 9.9.9.4

  # The production image running the client, as the README's sidecar example
  # does.
  dproxy-client:
    image: dproxy:local
    profiles:
      - sidecar
    user: "${DPROXY_E2E_UID:-65532}:${DPROXY_E2E_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - client
      - --config
      - /run/e2e/client.toml
    volumes:
      - type: bind
        source: ${DPROXY_E2E_DIR}
        target: /run/e2e
        read_only: true
      - type: bind
        source: ${DPROXY_E2E_DIR}/ca.pem
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
    depends_on:
      - front
    networks:
      e2e:
        ipv4_address: 9.9.9.5

  # The application: it shares the client's network namespace and reaches it
  # on loopback.
  probe:
    image: dproxy-e2e-fixture:local
    profiles:
      - sidecar
    user: "${DPROXY_E2E_UID:-65532}:${DPROXY_E2E_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - probe
      - /run/e2e
      - 127.0.0.1:18080
    volumes:
      - type: bind
        source: ${DPROXY_E2E_DIR}
        target: /run/e2e
        read_only: true
    network_mode: "service:dproxy-client"

  # A container on the same network but outside the client's namespace. It
  # must not reach the loopback-only listener.
  outsider:
    image: dproxy-e2e-fixture:local
    profiles:
      - sidecar
    user: "${DPROXY_E2E_UID:-65532}:${DPROXY_E2E_GID:-65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - probe
      - /run/e2e
      - 9.9.9.5:18080
    volumes:
      - type: bind
        source: ${DPROXY_E2E_DIR}
        target: /run/e2e
        read_only: true
    networks:
      - e2e

networks:
  e2e:
    ipam:
      config:
        - subnet: 9.9.9.0/29
