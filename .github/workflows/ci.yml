name: CI

# Runs on every pull request and on the default branch. Each job is blocking:
# formatting, lint, static analysis, dependency vulnerabilities, tests, and
# the race detector are engineering controls, not advisory output.

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, the dependency policy, module tidiness, and static analysis.
  # These fail fast and read clearly in a diff, so they are one job rather
  # than five.
  static:
    name: Format, dependencies, and analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum

      - name: Markdown formatting
        run: make md-check

      - name: Go formatting
        run: make fmt-check

      - name: Module tidiness
        run: make tidy-check

      - name: go vet
        run: make vet

      - name: Dependency policy
        run: make deps-check

      - name: staticcheck
        run: make staticcheck

  # Unit tests, then the same suite under the race detector. Both run because
  # a race-detector build can hide an ordinary failure behind a timeout.
  test:
    name: Unit and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: Coverage floor
        run: make coverage

      - name: Tests for this repository's own tools
        run: make test-tools

      - name: Race tests
        run: make race

  container:
    name: Remote container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build the non-root image
        run: make docker-build

      - name: Verify the configured runtime user
        run: test "$(docker image inspect dproxy:local --format '{{.Config.User}}')" = "65532:65532"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum

      - name: End-to-end suite
        run: make e2e

  # A vulnerable dependency blocks a merge, not just a release.
  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: govulncheck
        run: make vuln

      # The development tools are the only third-party code in this
      # repository, so they are scanned as well as the product module.
      - name: govulncheck for the development tools
        run: make vuln-tools
